[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dor-diagnostic-stack"
version = "0.7.0.dev0"
description = "DOR orchestration, reasoning, and mechanism-aware automatic fault-diagnostic pipeline design"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=1.5", "scikit-learn>=1.4", "joblib>=1.3"]

[project.scripts]
dor = "dor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/dor" = ["benchmarks/public_datasets.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
